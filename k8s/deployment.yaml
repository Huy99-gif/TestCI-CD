apiVersion: apps/v1
kind: Deployment
metadata:
  name: truyenapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truyenapi
  template:
    metadata:
      labels:
        app: truyenapi
    spec:
      containers:
        - name: truyenapi
          image: morningstart123/truyenapi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080